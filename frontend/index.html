<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube to Blog Generator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>YouTube to Blog Generator</h1>
            <p>Paste a YouTube URL below to automatically generate a blog post.</p>
        </header>

        <div class="input-group">
            <input type="text" id="youtubeUrlInput" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
            <button id="generateButton">Generate Blog</button>
        </div>

        <div id="blogContainer" class="blog-container">
            <!-- Loading text, errors, and generated blog content will appear here -->
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
